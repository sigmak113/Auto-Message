name: Build EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치 (클라우드 서버에만, 내 컴퓨터엔 설치 안 됨)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pyinstaller 설치
        run: pip install pyinstaller

      - name: exe 빌드
        run: pyinstaller --onefile --windowed --name 섭외메세지생성기 --icon assets/icon.ico main.py

      - name: templates.json / 아이콘 같이 넣기
        shell: powershell
        run: |
          Copy-Item templates.json dist/templates.json
          Copy-Item -Recurse assets dist/assets

      - name: exe 업로드 (다운로드 가능하게)
        uses: actions/upload-artifact@v4
        with:
          name: 섭외메세지생성기-exe
          path: dist/
